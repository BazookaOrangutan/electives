services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: electives
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - elective-network

  elective-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elective-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/electives
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL-AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - elective-network

volumes:
  postgres_data:

networks:
  elective-network:
    driver: bridge
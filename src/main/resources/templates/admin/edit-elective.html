<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Elective</title>
    <!-- Подключение Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .btn-back {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-back:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
<div class="container mt-5">

    <div style="display: flex; gap:10px; align-items: center; margin-bottom: 20px">
        <a href="/admin/electives" class="btn-back">
            <i class="fas fa-arrow-left"></i>
        </a>

        <h1>Изменить электив</h1>
    </div>

    <form th:action="@{/admin/electives/update/{id}(id=${elective.id})}" th:object="${elective}" method="post">
        <!-- Поле: Название электива -->
        <div class="mb-3">
            <label for="title" class="form-label">Название</label>
            <input type="text" class="form-control" id="title" th:field="*{title}" required>
        </div>

        <!-- Поле: Описание электива -->
        <div class="mb-3">
            <label for="description" class="form-label">Описание</label>
            <textarea class="form-control" id="description" th:field="*{description}" rows="5" maxlength="3000" required></textarea>
            <small class="form-text text-muted">Max 3000 characters</small>
        </div>

        <!-- Поле: Место проведения -->
        <div class="mb-3">
            <label for="place" class="form-label">Место проведения</label>
            <input type="text" class="form-control" id="place" th:field="*{place}" required>
        </div>

        <!-- Поле: Тип контроля -->
        <div class="mb-3">
            <label for="controlType" class="form-label">Вид контроля</label>
            <input type="text" class="form-control" id="controlType" th:field="*{controlType}" required>
        </div>

        <!-- Поле: Формат проведения -->
        <div class="mb-3">
            <label for="format" class="form-label">Формат</label>
            <input type="text" class="form-control" id="format" th:field="*{format}" required>
        </div>

        <!-- Поле: Интенсивность -->
        <div class="mb-3">
            <label for="intensity" class="form-label">Трудоемкость, ЗЕ</label>
            <input type="text" class="form-control" id="intensity" th:field="*{intensity}" required>
        </div>

        <!-- Поле: Выбор автора (лектора) -->
        <div class="mb-3">
            <label for="authorId" class="form-label">Автор</label>
            <select class="form-control" id="authorId" th:field="*{author.id}" required>
                <option th:each="lecturer : ${lecturers}"
                        th:value="${lecturer.id}"
                        th:text="${lecturer.name}"
                        th:selected="${lecturer.id == elective.author.id}"></option>
            </select>
        </div>

        <!-- Кнопка отправки формы -->
        <button style="margin: 20px 0" type="submit" class="btn btn-primary">Изменить</button>
    </form>
</div>
</body>
</html>

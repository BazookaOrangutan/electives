<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Преподаватели</title>
    <!-- Подключение Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключение FontAwesome для иконок -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background-color: #f8f9fa;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .navbar-custom a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            margin-left: 20px;
        }
        .navbar-custom a:hover {
            color: #007bff;
        }
        .table-custom {
            margin-top: 20px;
        }
        .btn-custom {
            margin-right: 5px;
        }
    </style>
</head>
<body>
<!-- Навигационная панель -->
<div class="navbar-custom">
    <div class="container">
        <h1 class="d-inline">Преподаватели</h1>
        <a href="/admin/electives" class="float-end">
            <i class="fas fa-book"></i> Элективы
        </a>
    </div>
</div>

<!-- Основной контент -->
<div class="container mt-4">
    <!-- Кнопка добавления преподавателя -->
    <a href="/admin/lecturer/new" class="btn btn-primary mb-3">
        <i class="fas fa-plus"></i> Добавить преподавателя
    </a>

    <!-- Таблица с преподавателями -->
    <table class="table table-bordered table-striped table-hover table-custom">
        <thead class="thead-light">
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="lecturer : ${lecturers}">
            <td th:text="${lecturer.id}"></td>
            <td th:text="${lecturer.name}"></td>
            <td>
                <a th:href="@{/admin/lecturers/edit/{id}(id=${lecturer.id})}" class="btn btn-sm btn-warning btn-custom">
                    <i class="fas fa-edit"></i> Edit
                </a>
                <a class="btn btn-sm btn-danger btn-custom" th:href="@{/admin/lecturers/delete/{id}(id=${lecturer.id})}"
                   onclick="return confirmDelete(this)">
                    <i class="fas fa-trash"></i> Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Подключение Bootstrap JS и Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Функция для подтверждения удаления
    function confirmDelete(link) {
        const isConfirmed = confirm("Вы уверены, что хотите удалить этого преподавателя?");
        if (isConfirmed) {
            window.location.href = link.href;
        }
        return false;
    }
</script>
</body>
</html>

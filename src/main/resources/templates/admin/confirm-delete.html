<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Подтверждение удаления</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h1>Подтверждение удаления</h1>
  <p>У этого преподавателя есть связанные элективы. Вы уверены, что хотите удалить преподавателя и все его элективы?</p>

  <form th:action="@{/admin/lecturers/confirm-delete/{id}(id=${lecturerId})}" method="get">
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a th:href="@{/admin/lecturers}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
</body>
</html>

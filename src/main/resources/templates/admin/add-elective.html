<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить электив</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .btn-back {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-back:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
<div class="container mt-5">

    <div style="display: flex; gap:10px; align-items: center; margin-bottom: 20px">
        <a href="/admin/electives" class="btn-back">
            <i class="fas fa-arrow-left"></i>
        </a>

        <h1>Создать электив</h1>
    </div>

    <form id="electiveForm" th:object="${electiveRequest}">
        <div class="mb-3">
            <label for="title" class="form-label">Название</label>
            <input type="text" class="form-control" id="title" th:field="*{title}" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Описание</label>
            <textarea class="form-control" id="description" th:field="*{description}" rows="5" maxlength="3000" required></textarea>
            <small class="form-text text-muted">Max 3000 characters</small>
        </div>

        <div class="mb-3">
            <label for="place" class="form-label">Место проведения</label>
            <input type="text" class="form-control" id="place" th:field="*{place}" required>
        </div>

        <div class="mb-3">
            <label for="controlType" class="form-label">Вид контроля</label>
            <input type="text" class="form-control" id="controlType" th:field="*{controlType}" required>
        </div>

        <div class="mb-3">
            <label for="format" class="form-label">Формат</label>
            <input type="text" class="form-control" id="format" th:field="*{format}" required>
        </div>

        <div class="mb-3">
            <label for="intensity" class="form-label">Трудоёмкость, ЗЕ</label>
            <input type="text" class="form-control" id="intensity" th:field="*{intensity}" required>
        </div>

        <div class="mb-3">
            <label for="authorId" class="form-label">Автор курса</label>
            <select class="form-control" id="authorId" th:field="*{authorId}" required>
                <option value="">Выберите преподавателя</option>
                <option th:each="lecturer : ${lecturers}" th:value="${lecturer.id}" th:text="${lecturer.name}"></option>
            </select>
        </div>

        <button style="margin: 20px 0" type="button" class="btn btn-primary" onclick="submitForm()">Создать</button>
    </form>
</div>

<script>
    function submitForm() {
        const formData = {
            title: document.getElementById('title').value,
            description: document.getElementById('description').value,
            place: document.getElementById('place').value,
            controlType: document.getElementById('controlType').value,
            format: document.getElementById('format').value,
            intensity: document.getElementById('intensity').value,
            authorId: document.getElementById('authorId').value,
            active: true
        };

        fetch('/api/v1/electives', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData),
        })
            .then(response => {
                if (response.ok) {
                    alert('Elective created successfully');
                    window.location.href = '/admin/electives'; // Перенаправление после успешного создания
                } else {
                    alert('Error creating elective');
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }
</script>
</body>
</html>

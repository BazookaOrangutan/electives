<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Electives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Create Elective</h1>
    <form th:action="@{/api/v1/electives}" th:object="${electiveRequest}" method="post">
        <!-- Поле: Название электива -->
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" th:field="*{title}" required>
        </div>

        <!-- Поле: Описание электива -->
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" th:field="*{description}" rows="5" maxlength="3000" required></textarea>
            <small class="form-text text-muted">Max 3000 characters</small>
        </div>

        <!-- Поле: Место проведения -->
        <div class="mb-3">
            <label for="place" class="form-label">Place</label>
            <input type="text" class="form-control" id="place" th:field="*{place}" required>
        </div>

        <!-- Поле: Тип контроля -->
        <div class="mb-3">
            <label for="controlType" class="form-label">Control Type</label>
            <input type="text" class="form-control" id="controlType" th:field="*{controlType}" required>
        </div>

        <!-- Поле: Формат проведения -->
        <div class="mb-3">
            <label for="format" class="form-label">Format</label>
            <input type="text" class="form-control" id="format" th:field="*{format}" required>
        </div>

        <!-- Поле: Интенсивность -->
        <div class="mb-3">
            <label for="intensity" class="form-label">Intensity</label>
            <input type="text" class="form-control" id="intensity" th:field="*{intensity}" required>
        </div>

        <!-- Поле: Выбор автора (лектора) -->
        <div class="mb-3">
            <label for="authorId" class="form-label">Author</label>
            <select class="form-control" id="authorId" th:field="*{authorId}" required>
                <option value="">Select a lecturer</option>
                <option th:each="lecturer : ${lecturers}" th:value="${lecturer.id}" th:text="${lecturer.name}"></option>
            </select>
        </div>

        <!-- Кнопка отправки формы -->
        <button type="submit" class="btn btn-primary">Create Elective</button>
    </form>
</div>

<!-- Подключение Bootstrap JS (опционально) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

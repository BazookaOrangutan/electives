<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Electives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background-color: #f8f9fa;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .navbar-custom a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            margin-left: 20px;
        }
        .navbar-custom a:hover {
            color: #007bff;
        }
        .table-custom {
            margin-top: 20px;
        }
        .btn-custom {
            margin-right: 5px;
        }
        .drag-handle {
            cursor: move;
            width: 30px;
        }
        .table tbody tr {
            user-select: none;
        }
        .table tbody tr.sortable-chosen {
            background-color: #f8f9fa;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .table tbody td {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .table tbody td.description-cell {
            white-space: normal;
            max-height: 60px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

<div class="navbar-custom">
    <div class="container">
        <h1 class="d-inline">Элективы</h1>
        <a href="/admin/lecturers" class="float-end">
            <i class="fas fa-chalkboard-teacher"></i> Преподаватели
        </a>
    </div>
</div>

<div class="container mt-4">

    <a href="/admin/electives/new" class="btn btn-primary mb-3">
        <i class="fas fa-plus"></i> Добавить электив
    </a>

    <table class="table table-bordered table-striped table-hover table-custom" id="electivesTable">
        <thead class="thead-light">
        <tr>
            <th>#</th>
            <th>ID</th>
            <th>Название</th>
            <th>Описание</th>
            <th>Место</th>
            <th>Формат</th>
            <th>Контроль</th>
            <th>Интенсивность</th>
            <th>Автор</th>
            <th>Активнось</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="elective : ${electives}" th:data-id="${elective.id}">
            <td class="drag-handle"><i class="fas fa-arrows-alt"></i></td>
            <td class="description-cell" th:text="${elective.id}"></td>
            <td th:text="${elective.title}"></td>
            <td th:text="${elective.description}"></td>
            <td th:text="${elective.place}"></td>
            <td th:text="${elective.format}"></td>
            <td th:text="${elective.controlType}"></td>
            <td th:text="${elective.intensity}"></td>
            <td th:text="${elective.getAuthor().getName()}"></td>
            <td>
                <div class="form-check form-switch">
                    <input class="form-check-input active-toggle"
                           type="checkbox"
                           th:checked="${elective.active}"
                           th:data-id="${elective.id}"
                           id="activeToggle_${elective.id}">
                    <label class="form-check-label status-text"
                           th:for="'activeToggle_' + ${elective.id}"
                           th:text="${elective.active} ? 'Активен' : 'Неактивен'">
                    </label>
                </div>
            </td>
            <td>
                <a th:href="@{/admin/electives/edit/{id}(id=${elective.id})}" class="btn btn-sm btn-warning btn-custom">
                    <i class="fas fa-edit"></i> Edit
                </a>
                <a class="btn btn-sm btn-danger btn-custom" th:href="@{/admin/electives/delete/{id}(id=${elective.id})}"
                   onclick="return confirmDelete(this)">
                    <i class="fas fa-trash"></i> Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function confirmDelete(link) {
        const isConfirmed = confirm("Вы уверены, что хотите удалить этот электив?");
        if (isConfirmed) {
            window.location.href = link.href;
        }
        return false;
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.active-toggle').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const electiveId = this.getAttribute('data-id');
                const isActive = this.checked;
                const label = this.nextElementSibling;

                fetch(`/api/v1/electives/${electiveId}/active`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ active: isActive })
                })
                    .then(response => {
                        if (!response.ok) {
                            this.checked = !isActive;
                            throw new Error('Ошибка при обновлении статуса');
                        }
                        label.textContent = isActive ? 'Активен' : 'Неактивен';
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Не удалось обновить статус электива');
                    });
            });
        });

        const electivesTable = document.getElementById('electivesTable');
        if (electivesTable) {
            new Sortable(electivesTable.querySelector('tbody'), {
                animation: 150,
                handle: '.drag-handle',
                onEnd: function() {
                    const rows = electivesTable.querySelectorAll('tbody tr');
                    const newOrder = Array.from(rows).map(row => row.getAttribute('data-id'));

                    fetch('/api/v1/electives/reorder', {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(newOrder)
                    }).then(response => {
                        if (!response.ok) {
                            alert('Ошибка при сохранении порядка');
                            window.location.reload();
                        }
                    }).catch(error => {
                        console.error('Error:', error);
                        alert('Не удалось сохранить порядок');
                    });
                }
            });
        }
    });


</script>
</body>
</html>

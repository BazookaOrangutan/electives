<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Electives</title>
    <!-- Подключение Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключение FontAwesome для иконок -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background-color: #f8f9fa;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .navbar-custom a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            margin-left: 20px;
        }
        .navbar-custom a:hover {
            color: #007bff;
        }
        .table-custom {
            margin-top: 20px;
        }
        .btn-custom {
            margin-right: 5px;
        }
    </style>
</head>
<body>
<!-- Навигационная панель -->
<div class="navbar-custom">
    <div class="container">
        <h1 class="d-inline">Элективы</h1>
        <a href="/admin/lecturers" class="float-end">
            <i class="fas fa-chalkboard-teacher"></i> Преподаватели
        </a>
    </div>
</div>

<!-- Основной контент -->
<div class="container mt-4">
    <!-- Кнопка добавления электива -->
    <a href="/admin/electives/new" class="btn btn-primary mb-3">
        <i class="fas fa-plus"></i> Добавить электив
    </a>

    <!-- Таблица с элективами -->
    <table class="table table-bordered table-striped table-hover table-custom">
        <thead class="thead-light">
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Описание</th>
            <th>Место</th>
            <th>Формат</th>
            <th>Контроль</th>
            <th>Интенсивность</th>
            <th>Автор</th>
            <th>Активнось</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="elective : ${electives}">
            <td th:text="${elective.id}"></td>
            <td th:text="${elective.title}"></td>
            <td th:text="${elective.description}"></td>
            <td th:text="${elective.place}"></td>
            <td th:text="${elective.format}"></td>
            <td th:text="${elective.controlType}"></td>
            <td th:text="${elective.intensity}"></td>
            <td th:text="${elective.getAuthor().getName()}"></td>
            <td>
                <div class="form-check form-switch">
                    <input class="form-check-input active-toggle"
                           type="checkbox"
                           th:checked="${elective.active}"
                           th:data-id="${elective.id}"
                           id="activeToggle_${elective.id}">
                    <label class="form-check-label status-text"
                           th:for="'activeToggle_' + ${elective.id}"
                           th:text="${elective.active} ? 'Активен' : 'Неактивен'">
                    </label>
                </div>
            </td>
            <td>
                <a th:href="@{/admin/electives/edit/{id}(id=${elective.id})}" class="btn btn-sm btn-warning btn-custom">
                    <i class="fas fa-edit"></i> Edit
                </a>
                <a class="btn btn-sm btn-danger btn-custom" th:href="@{/admin/electives/delete/{id}(id=${elective.id})}"
                   onclick="return confirmDelete(this)">
                    <i class="fas fa-trash"></i> Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Подключение Bootstrap JS и Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Функция для подтверждения удаления
    function confirmDelete(link) {
        const isConfirmed = confirm("Вы уверены, что хотите удалить этот электив?");
        if (isConfirmed) {
            window.location.href = link.href;
        }
        return false;
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.active-toggle').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const electiveId = this.getAttribute('data-id');
                const isActive = this.checked;
                const label = this.nextElementSibling;

                fetch(`/api/v1/electives/${electiveId}/active`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ active: isActive })
                })
                    .then(response => {
                        if (!response.ok) {
                            // Если ошибка, возвращаем чекбокс в предыдущее состояние
                            this.checked = !isActive;
                            throw new Error('Ошибка при обновлении статуса');
                        }
                        // Обновляем текст статуса
                        label.textContent = isActive ? 'Активен' : 'Неактивен';
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Не удалось обновить статус электива');
                    });
            });
        });
    });
</script>
</body>
</html>

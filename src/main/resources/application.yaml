spring:
  application:
    name: electives
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/elective}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:7878}
  jpa:
    hibernate:
      ddl-auto: create-drop # update для продакшн
    show-sql: true
logging:
  level:
    org:
      springframework:
        security: DEBUG
